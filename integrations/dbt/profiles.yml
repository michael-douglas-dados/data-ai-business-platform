business_workbench:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '55488') | int }}"
      user: "{{ env_var('PGUSER', 'portfolio') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'portfolio') }}"
      schema: analytics
      threads: 2
